<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ObsidianApp</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside>
    <div class="brand"><span class="gem">◆</span><span>ObsidianApp</span></div>
    <button id="choose-vault" class="vault-button">Vaultを選択</button>
    <p id="vault-label" class="vault-label">Vaultが未選択です</p>
    <div class="notes-header"><span>ノート</span><button id="new-note" title="新規メモ">＋</button></div>
    <label class="search"><span>⌕</span><input id="search" placeholder="ノートを検索" /></label>
    <nav id="notes-list"></nav>
  </aside>
  <main>
    <div id="empty-state" class="empty-state">
      <span class="large-gem">◆</span>
      <h1>あなたの思考を、Obsidianへ。</h1>
      <p>Vaultを選択すると、既存ノートの閲覧と新しいメモの作成を始められます。</p>
      <button id="empty-choose">Vaultを選択する</button>
    </div>
    <section id="editor" hidden>
      <div class="editor-bar"><span id="file-path"></span><span id="save-state">保存済み</span><button id="delete-note" class="delete">削除</button></div>
      <textarea id="content" spellcheck="false" placeholder="ここに書き始めてください…"></textarea>
    </section>
  </main>
  <div id="toast" role="status"></div>
  <script src="renderer.js"></script>
</body>
</html>
